name: release-tag

# publish-npm.yml triggers only on vivijure-mcp-v*. Any other tag creates no
# publish run, and an absent run looks like a passed one (mcp#70). This
# workflow runs on every tag and fails when the prefix is missing. It does
# not publish.

on:
  push:
    tags:
      - "*"

permissions:
  contents: read

jobs:
  prefix:
    name: prefix
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Fail a tag publish-npm.yml will not run
        run: node scripts/release-tag.mjs
